<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מגמות גושיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#5B6577;
    --paper:#F2F4F8;
    --card:#FFFFFF;
    --line:#E1E5EC;

    --rust:#C1622D;
    --rust-light:#D98A55;
    --rust-pale:#EBC49B;

    --navy:#2C4870;
    --blue-mid:#3E6491;
    --blue-light:#6F97C2;
    --blue-pale:#B9CBE0;

    --slate:#6B7280;
    --slate-light:#A8AEB8;

    --teal:#4F8076;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    font-weight:400;
    line-height:1.45;
    padding:28px 18px 60px;
  }

  .page{
    max-width:920px;
    margin:0 auto;
  }

  /* ---------- Header ---------- */
  header h1{
    font-size:clamp(28px,5vw,38px);
    font-weight:800;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p.sub{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 26px;
    max-width:56ch;
  }

  /* ---------- Hero stats ---------- */
  .hero{
    display:flex;
    gap:14px;
    margin-bottom:30px;
    flex-wrap:wrap;
  }
  .stat{
    flex:1 1 220px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .stat .num-wrap{display:flex;align-items:baseline;gap:10px;justify-content:space-between;}
  .stat .num{
    font-size:36px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .stat .lbl{
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .stat .delta{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .stat.rust .num{color:var(--rust);}
  .stat.navy .num{color:var(--navy);}

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .controls-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .method-btn{
    border:1px solid var(--line);
    background:var(--card);
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .method-btn:hover{
    background:#EAEDF3;
    border-color:#c7ccd6;
  }

  /* ---------- Methodology modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(27,36,48,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay[hidden]{
    display:none;
  }
  .modal-card{
    background:var(--card);
    border-radius:18px;
    max-width:640px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    padding:26px 24px 24px;
    position:relative;
    box-shadow:0 20px 60px rgba(20,25,35,0.25);
  }
  .modal-close{
    position:absolute;
    top:14px;
    left:14px;
    border:none;
    background:var(--paper);
    width:32px;
    height:32px;
    border-radius:50%;
    font-size:18px;
    line-height:1;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .modal-close:hover{ color:var(--ink); }
  .modal-card h2{
    font-size:19px;
    font-weight:800;
    margin:0 0 4px;
    padding-left:36px;
  }
  .method-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .method-group{ margin-bottom:16px; }
  .method-group-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .method-group-head .sw{ width:11px; height:11px; border-radius:3px; flex:none; }
  .method-group ul{
    margin:0;
    padding-right:19px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .method-group li{
    font-size:13.5px;
    color:var(--ink);
    line-height:1.4;
  }
  .method-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .method-table th{
    text-align:right;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding:6px 8px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .method-table td{
    padding:7px 8px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  .method-table td .sw.inline{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:3px;
    margin-left:6px;
    vertical-align:middle;
  }
  @media (max-width:520px){
    .modal-card{ padding:22px 16px 18px; max-height:88vh; }
    .method-table{ font-size:12px; }
  }

  .seg{
    display:inline-flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    gap:2px;
  }
  .seg button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
    white-space:nowrap;
  }
  .seg button.active{
    background:var(--ink);
    color:#fff;
  }
  .seg button:not(.active):hover{
    color:var(--ink);
  }

  /* ---------- Chart card ---------- */
  .chart-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 18px 10px;
    margin-bottom:18px;
  }
  .chart-card h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 2px;
  }
  .chart-card .chart-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .chart-wrap{
    position:relative;
    width:100%;
    height:420px;
  }
  @media (max-width:600px){
    .chart-wrap{height:360px;}
  }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:16px 4px 6px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:999px;
    padding:6px 12px 6px 10px;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, border-color .15s ease, background .15s ease;
  }
  .chip .sw{
    width:10px;
    height:10px;
    border-radius:3px;
    flex:none;
  }
  .chip.off{
    opacity:.38;
  }
  .chip:hover{
    border-color:#c7ccd6;
    background:#EAEDF3;
  }

  /* ---------- Footer ---------- */
  footer{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  footer a{
    color:var(--ink);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--slate-light);
  }
  footer a:hover{border-color:var(--ink);}
  .footer-links{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>מגמות גושיות</h1>
    <p class="sub">מעקב אחרי גודל הגושים לאורך זמן וסקרים. הנתונים מחולקים לגוש הקואליציה, גוש האופוזיציה, מפלגות האמצע ומצביעים שלא הוכרעו.</p>
  </header>

  <div class="hero" id="hero"></div>

  <div class="controls">
    <div class="seg" id="chartTabs">
      <button data-chart="1" class="active">לפי הצבעת עבר</button>
      <button data-chart="2">לפי חלופה שנייה</button>
    </div>
    <div class="controls-right">
      <div class="seg" id="modeTabs">
        <button data-mode="stacked" class="active">עמודות</button>
        <button data-mode="line">קווים</button>
      </div>
      <button id="methodologyBtn" class="method-btn">מתודולוגיה</button>
    </div>
  </div>

  <div id="methodOverlay" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="methodClose" class="modal-close" aria-label="סגור">×</button>
      <h2 id="methodTitle"></h2>
      <p id="methodSub" class="method-sub"></p>
      <div id="methodBody"></div>
    </div>
  </div>

  <div class="chart-card">
    <h2 id="chartTitle"></h2>
    <p class="chart-note" id="chartNote"></p>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    <div class="legend" id="legend"></div>
  </div>

const chart2 = {

// resolve css-var colors for chart1 into concrete hex (Chart.js needs real colors)
chart1.series.forEach(s=>{ if(!s.hex) return; });

/* ===================== METHODOLOGY DATA ===================== */
const chart1Methodology = [
  { bloc:'קואליציה', color:'#C1622D', items:[
    'הליכוד בראשות בנימין נתניהו',
    'הציונות הדתית בראשות בצלאל סמוטריץ׳',

    'ש״ס בראשות אריה דרעי',
    'עמך ישראל (מפלגת וינטר-חדאד) בראשות עופר וינטר',
  ]},
  { bloc:'אופוזיציה', color:'#2C4870', items:[

const chart2Logic = [
  { a:'קואליציה', b:'קואליציה / "אין לי חלופה שנייה"', group:'בייס קוא' },
  { a:'קואליציה', b:'אופוזיציה',                        group:'מתלבטים נוטים קוא' },
  { a:'קואליציה', b:'הגוש השלישי / אחר / לא מצביע',      group:'פריכי קוא' },
  { a:'אופוזיציה', b:'אופוזיציה / "אין לי חלופה שנייה"', group:'בייס אופ' },
  { a:'אופוזיציה', b:'קואליציה',                         group:'מתלבטים נוטים אופ' },
  { a:'אופוזיציה', b:'הגוש השלישי / אחר / לא מצביע',      group:'פריכי אופ' },
  { a:'הגוש השלישי', b:'כל חלופה',                       group:'הגוש השלישי' },
  { a:'אחר', b:'כל חלופה',                                group:'מיואשים' },
  { a:'לא מצביע', b:'כל חלופה',                           group:'לא מצביעים' },
];

function groupColor(name){
  const has = k => name.indexOf(k) !== -1;
  if(has('בייס') && has('קוא')) return '#C1622D';
  if(has('פריכי') && has('קוא')) return '#D98A55';
  if((has('מתלבטים')||has('נוטים')) && has('קוא')) return '#EBC49B';
  if(has('בייס') && has('אופ')) return '#2C4870';
  if(has('פריכי') && has('אופ')) return '#3E6491';
  if((has('מתלבטים')||has('נוטים')) && has('אופ')) return '#B9CBE0';
  if(has('שלישי')) return '#6F97C2';
  if(has('מיואש')) return '#A8AEB8';
  if(has('מצביע')) return '#6B7280';
  return '#8B93A1';
}

/* ===================== STATE ===================== */
let state = { chart: 1, mode: 'stacked', hidden: new Set() };
let chartInstance = null;

/* ===================== HERO ===================== */
function renderHero(){
  const s = chart1.series;
  const coal = s.find(x => x.label === 'קואליציה');
  const opp = s.find(x => x.label === 'אופוזיציה');
  const last = coal.data.length - 1;
  const prev = last - 1;
  const deltaCoal = coal.data[last] - coal.data[prev];
  const deltaOpp = opp.data[last] - opp.data[prev];
  const prevLabel = chart1.categories[prev];
  const fmtDelta = d => (d>0?'+':'') + d + ' מסקר ' + prevLabel;

  document.getElementById('hero').innerHTML = `
    <div class="stat rust">
      <div class="num-wrap">
        <span class="num">${coal.data[last]}%</span>
        <span class="lbl">קואליציה</span>
      </div>
      <span class="delta">${fmtDelta(deltaCoal)}</span>
    </div>
    <div class="stat navy">
      <div class="num-wrap">
        <span class="num">${opp.data[last]}%</span>
        <span class="lbl">אופוזיציה</span>
      </div>
      <span class="delta">${fmtDelta(deltaOpp)}</span>
    </div>
  `;
}

/* ===================== HELPERS ===================== */
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function resolveColor(s){
  return s.hex;
}

/* ===================== CHART RENDER ===================== */
function getActiveData(){ return state.chart === 1 ? chart1 : chart2; }

function buildDatasets(data, mode){
  return data.series.map(s => {
    const base = resolveColor(s);
    const hiddenFlag = state.hidden.has(s.label);
    if(mode === 'stacked'){
      return {
        label: s.label,
        data: s.data,
        backgroundColor: base,
        borderRadius: 0,
        hidden: hiddenFlag,
        stack: 'total',
      };
    } else {
      return {
        label: s.label,
        data: s.data,
        borderColor: base,
        backgroundColor: base,
        pointRadius: 3,
        pointHoverRadius: 5,
        borderWidth: 2.5,
        tension: 0.25,
        fill: false,
        hidden: hiddenFlag,
      };
    }
  });
}

function renderChart(){
  const data = getActiveData();
  const ctx = document.getElementById('mainChart').getContext('2d');

  const titleMap = {
    1: 'מגמה גושית לפי הצבעת עבר וכוונת הצבעה',
    2: 'מגמה גושית לפי כוונת הצבעה וחלופה שנייה'
  };
  const noteMap = {
    1: '',
    2: 'פירוט מדורג בתוך כל גוש — מהתומכים המובהקים (הבייס) ועד המתלבטים, לצד לא-מצביעים ומיואשים.'
  };
  document.getElementById('chartTitle').textContent = titleMap[state.chart];
  const noteEl = document.getElementById('chartNote');
  noteEl.textContent = noteMap[state.chart];
  noteEl.style.display = noteMap[state.chart] ? '' : 'none';

  const datasets = buildDatasets(data, state.mode);

  const commonScales = {
    x: {
      stacked: state.mode === 'stacked',
      reverse: false,
      grid: { display:false },
      ticks: {
        color:'#5B6577',
        font:{ family:'Heebo', size: 11 },
        maxRotation: state.chart === 1 ? 55 : 0,
        minRotation: state.chart === 1 ? 55 : 0,
        autoSkip: false,
      }
    },
    y: {
      stacked: state.mode === 'stacked',
      min: 0,
      max: state.mode === 'stacked' ? 100 : undefined,
      grid: { color:'#EAEDF3' },
      ticks: {
        color:'#5B6577',
        font:{ family:'Heebo', size: 11 },
        callback: v => v + '%'
      }
    }
  };

  const config = {
    type: state.mode === 'stacked' ? 'bar' : 'line',
    data: { labels: data.categories, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      rtl: false,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 350 },
      plugins: {
        legend: { display:false },
        tooltip: {
          rtl: true,
          textDirection: 'rtl',
          backgroundColor: '#1B2430',
          titleFont: { family:'Heebo', size: 12, weight:'700' },
          bodyFont: { family:'Heebo', size: 12 },
          padding: 10,
          cornerRadius: 8,
          itemSort: state.mode === 'stacked'
            ? (a, b) => b.datasetIndex - a.datasetIndex
            : undefined,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: ${ctx.formattedValue}%`
          }
        }
      },
      scales: commonScales
    }
  };

  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, config);
}

/* ===================== LEGEND ===================== */
function renderLegend(){
  const data = getActiveData();
  const wrap = document.getElementById('legend');
  wrap.innerHTML = '';

  data.series.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.hidden.has(s.label) ? ' off' : '');
    chip.innerHTML = `<span class="sw" style="background:${resolveColor(s)}"></span>${s.label}`;

    chip.addEventListener('click', () => {
      if(state.hidden.has(s.label)) state.hidden.delete(s.label);
      else state.hidden.add(s.label);
      renderLegend();
      renderChart();
    });

    chip.addEventListener('mouseenter', () => highlightSeries(s.label));
    chip.addEventListener('mouseleave', () => clearHighlight());

    wrap.appendChild(chip);
  });
}

function highlightSeries(label){
  if(!chartInstance) return;
  chartInstance.data.datasets.forEach(ds => {
    const dim = ds.label !== label;
    const src = getActiveData().series.find(s => s.label === ds.label);
    const c = resolveColor(src);
    if(state.mode === 'stacked'){
      ds.backgroundColor = dim ? hexToRgba(c, 0.25) : c;
    } else {
      ds.borderColor = dim ? hexToRgba(c, 0.25) : c;
      ds.backgroundColor = dim ? hexToRgba(c, 0.25) : c;
    }
  });
  chartInstance.update('none');
}
function clearHighlight(){
  if(!chartInstance) return;
  chartInstance.data.datasets.forEach(ds => {
    const src = getActiveData().series.find(s => s.label === ds.label);
    const c = resolveColor(src);
    ds.backgroundColor = c;
    if(state.mode === 'line') ds.borderColor = c;
  });
  chartInstance.update('none');
}

/* ===================== CONTROLS ===================== */
document.getElementById('chartTabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#chartTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.chart = Number(btn.dataset.chart);
  state.hidden.clear();
  renderLegend();
  renderChart();
});

document.getElementById('modeTabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#modeTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.mode = btn.dataset.mode;
  renderChart();
});

/* ===================== METHODOLOGY MODAL ===================== */
function renderMethodology(){
  const overlay = document.getElementById('methodOverlay');
  const title = document.getElementById('methodTitle');
  const sub = document.getElementById('methodSub');
  const body = document.getElementById('methodBody');

  if(state.chart === 1){
    title.textContent = 'מתודולוגיה — חלוקה לגושים לפי הצבעת עבר';
    sub.textContent = 'כל מפלגה משויכת לאחד מארבעת הגושים לפי כוונת ההצבעה שדווחה בסקר.';
    body.innerHTML = chart1Methodology.map(b => `
      <div class="method-group">
        <div class="method-group-head"><span class="sw" style="background:${b.color}"></span>${b.bloc}</div>
        <ul>${b.items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>
    `).join('');
  } else {
    title.textContent = 'מתודולוגיה — הגדרת הקבוצות לפי חלופה שנייה';
    sub.textContent = 'כל משיב מסווג לקבוצה לפי השילוב בין כוונת ההצבעה שלו (חלופה 1) לבין החלופה השנייה שציין.';
    body.innerHTML = `
      <table class="method-table">
        <thead>
          <tr><th>כוונת הצבעה (חלופה 1)</th><th>חלופה שנייה</th><th>קבוצה</th></tr>
        </thead>
        <tbody>
          ${chart2Logic.map(r => `
            <tr>
              <td>${r.a}</td>
              <td>${r.b}</td>
              <td><span class="sw inline" style="background:${groupColor(r.group)}"></span>${r.group}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  overlay.hidden = false;
}
function closeMethodology(){
  document.getElementById('methodOverlay').hidden = true;
}

document.getElementById('methodologyBtn').addEventListener('click', renderMethodology);
document.getElementById('methodClose').addEventListener('click', closeMethodology);
document.getElementById('methodOverlay').addEventListener('click', e => {
  if(e.target.id === 'methodOverlay') closeMethodology();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeMethodology();
});

/* ===================== INIT ===================== */
if(typeof Chart === 'undefined'){
  document.querySelector('.chart-card').innerHTML =
    '<p style="padding:20px;color:#b23b3b;">לא הצלחתי לטעון את ספריית הגרפים (Chart.js) מהרשת. רענן/י את הדף — אם הבעיה חוזרת, ייתכן שהחיבור לאינטרנט חסום.</p>';
  renderHero();
} else {
  Chart.defaults.font.family = 'Heebo';
  renderHero();
  renderLegend();
  renderChart();
}
</script>
